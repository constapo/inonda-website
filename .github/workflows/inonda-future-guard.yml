name: INONDA architectural release checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  preserve-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve original content, metadata, branding and calculator sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines()
          allowed = {'.github/workflows/inonda-future-guard.yml', 'docs/INONDA_ARCHITECTURAL_RELEASE.md', 'tools/inonda_future.py', 'tools/future-design.css', 'tools/future-ui.js', 'public/assets/future-design.css', 'public/assets/future-ui.js', 'dist/future-design.css', 'dist/future-ui.js'}
          def previous(path):
              return subprocess.check_output(['git', 'show', 'origin/main:' + path], text=True)
          def normalize(text):
              text = re.sub(r'<!-- INONDA FUTURE ASSETS START -->.*?<!-- INONDA FUTURE ASSETS END -->', '', text, flags=re.S)
              return re.sub(r'(\.(?:css|js|svg)\?v=)[^"\'<> ]+', r'\1VERSION', text)
          for path in changed:
              new = Path(path).read_text()
              if path.endswith('.html'):
                  assert normalize(previous(path)) == normalize(new), 'Original HTML changed: ' + path
              elif path == 'tools/inonda_network.py':
                  old = previous(path).replace("VERSION = '20261030-1'", "VERSION = '20261030-2'")
                  old = old.replace('from inonda_seo import enhance_seo', 'from inonda_seo import enhance_seo\nfrom inonda_future import enhance_future')
                  old = old.replace('    return text\n\n\nCSS =', '    return enhance_future(text, site)\n\n\nCSS =')
                  assert new == old, 'Unexpected shared generator change'
              elif path in ['server.py', 'host/server.py']:
                  old = previous(path)
                  routes = "          '/future-design.css': ('future-design.css', 'text/css; charset=utf-8'),\n          '/future-ui.js': ('future-ui.js', 'text/javascript; charset=utf-8'),\n"
                  assert new == old.replace("          '/styles.css':", routes + "          '/styles.css':"), 'Unexpected host behavior change'
              else:
                  assert path in allowed, 'Unexpected changed file: ' + path
          print('Original content, metadata, logo files and calculation code preserved')
          PY
      - name: Validate complete design assets and reproducible source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          assets = Path('dist') if Path('dist/index.html').exists() else Path('public/assets')
          for name in ['future-design.css', 'future-ui.js']:
              assert (assets/name).read_bytes() == (Path('tools')/name).read_bytes(), 'Design source mismatch'
          css = (assets/'future-design.css').read_text()
          assert 'INONDA FUTURE' in css and 'prefers-reduced-motion' in css and '@media print' in css
          stripped = re.sub(r'/\*.*?\*/', '', css, flags=re.S)
          assert stripped.count('{') == stripped.count('}'), 'Unbalanced CSS'
          import sys
          sys.path.insert(0,'tools')
          from inonda_future import enhance_future
          sample = '<head><title>Preserved</title></head><body><header></header><main>Original content</main></body>'
          site = 'homes' if assets == Path('dist') else 'site'
          enhanced = enhance_future(sample,site)
          assert enhance_future(enhanced,site) == enhanced, 'Enhancement must be idempotent'
          assert enhanced.split('</head>',1)[1] == sample.split('</head>',1)[1], 'Original body changed'
          PY
          node --check tools/future-ui.js
      - name: Verify estimator access, languages and calculations when present
        run: |
          if [ -f server.py ]; then
            cmp server.py host/server.py
            node --test tests/*.test.mjs
            python3 -m unittest discover -s tests -p 'test_*.py'
          fi
