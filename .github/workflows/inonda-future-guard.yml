name: INONDA Future safeguard checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  preserve-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve text, logo assets and application logic
        run: |
          python3 - <<'PYGUARD'
          from pathlib import Path
          import re, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines()
          allowed = {'public/assets/site.css', 'dist/styles.css', 'dist/sitemap.xml',
                     'docs/INONDA_FUTURE_SEO.md', '.github/workflows/inonda-future-guard.yml',
                     'tools/inonda_network.py', 'tests/test_host.py'}
          def previous(path):
              return subprocess.check_output(['git', 'show', 'origin/main:' + path], text=True)
          def normalize_versions(text):
              return re.sub(r'(\.(?:css|js|svg)\?v=)[^"\'<> ]+', r'\1VERSION', text)
          for path in changed:
              if path.endswith('.html') and (path.startswith('public/') or path == 'dist/index.html'):
                  old, new = previous(path), Path(path).read_text()
                  if path.startswith('public/'):
                      assert normalize_versions(old) == normalize_versions(new), 'HTML content changed: ' + path
                  else:
                      assert normalize_versions(old.split('</head>', 1)[1]) == normalize_versions(new.split('</head>', 1)[1]), 'Estimator body changed'
              else:
                  assert path in allowed, 'Unexpected change: ' + path
          if 'tools/inonda_network.py' in changed:
              old, new = previous('tools/inonda_network.py'), Path('tools/inonda_network.py').read_text()
              normalize = lambda text: re.sub(r"^VERSION = '[^']+'", "VERSION = 'VERSION'", text, flags=re.M)
              assert normalize(old) == normalize(new), 'Shared generator logic changed'
          print('Written content, logo assets and application/calculation code preserved')
          PYGUARD
      - name: Check CSS braces and mandatory reduced-motion handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css_files=[p for p in (Path('public/assets/site.css'),Path('dist/styles.css')) if p.exists()]
          assert css_files, 'No stylesheet found'
          for p in css_files:
              s=p.read_text(encoding='utf-8')
              assert 'INONDA FUTURE' in s
              assert 'prefers-reduced-motion' in s
              depth=0
              in_comment=False
              in_quote=None
              i=0
              while i<len(s):
                  c=s[i]
                  if in_comment:
                      if s[i:i+2]=='*/': in_comment=False; i+=2; continue
                  elif in_quote:
                      if c=='\\': i+=2; continue
                      if c==in_quote: in_quote=None
                  elif s[i:i+2]=='/*': in_comment=True; i+=2; continue
                  elif c in ('"',"'"): in_quote=c
                  elif c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      assert depth>=0, f'Unbalanced CSS in {p}'
                  i+=1
              assert depth==0 and not in_comment and not in_quote, f'Incomplete CSS in {p}'
              print(f'{p}: structural checks passed')
          PY

